[project]
name = "swole-yolo"
version = "0.1.0"
description = "Fine-tuning de YOLO11n-OBB para deteccion vehicular orientada en trafico peruano, con benchmark en Raspberry Pi."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3",   # reproduccion verificada con 8.4.211 (ver docs/PLAN.md)
    "pillow",
    "matplotlib",
    "pandas",
    "tqdm",
    "psutil",
    "onnx",
    "ncnn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swole_yolo"]
